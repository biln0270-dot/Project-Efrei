<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <title>Efrei login</title>
  <link rel="stylesheet" href="estyle.css">
</head>
<body>

<div class="login-container">
          <img class="efrei-logo" src="./images/elogo.jpeg" alt="Efrei Logo" >
          <h1>
              EFREI
          </h1>
          <p>
          &reg;
          </p>
          </div>
          <p>
              To continue, log in to Efrei.
          </p>   
          <div class="social-login">

          <div>
          <button class="facebook-button">
              <img src="./images/facebook.png" alt="Facebook Logo" class="facebook-logo">
              CONTINUE WITH FACEBOOK
          </button><br>
          </div>
        <div>
          <button class="apple-button">
              <img src="./images/apple.png" alt="Apple Logo" class="apple-logo">
              CONTINUE WITH APPLE
          </button><br>
          </div>
          <div>
          <button class="google-button">
              <img src="./images/google.png" alt="Logo" class="google-logo">
              CONTINUE WITH GOOGLE
          </button><br>
          </div>
      </div>
          <p>
              OR
          </p>
          <div class="login-form">
          <p>
              Email address or username
          </p>
          <input class="c1" type="text" placeholder="Email address or username"><br>
          <p>
              Password   
          </p>
          <input class="c1" type="text" placeholder="Password"><br> 
          <p class="c2">
              Forgot your password?
          </p>  
          </div>
          <div class="remember-me">  
          <input type="checkbox"  ><p class="c3">
              Remember me
          </p>
          <button class="login-button">
              LOG IN
          </button>
          </div>
          <p style="margin-bottom: 15px;">
              Don't have an account?
          </p>
          <button class="signup-button">
              SIGN UP 
          </button>
</body>
</html>
